<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nono 导航</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="app">
      <section class="hero">
        <h1 id="site-name">Nono</h1>
        <p id="site-info">一个可自托管的网址导航主页</p>
        <form class="search" id="search-form">
          <span>⌕</span>
          <input id="search-input" type="search" autocomplete="off" placeholder="搜索站内链接，回车百度">
          <button type="submit">搜索</button>
        </form>
      </section>
      <nav class="tabs" id="tabs" aria-label="导航分类"></nav>
      <section class="grid" id="folders" aria-live="polite"></section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
