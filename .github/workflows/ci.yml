name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nono_integration
          POSTGRES_PASSWORD: nono-integration-only
          POSTGRES_DB: nono_integration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nono_integration -d nono_integration_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/nomoney/package-lock.json
            apps/nostar/package-lock.json

      - name: Install all dependencies
        run: npm run install:all

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify real PostgreSQL migrations and API isolation
        env:
          NONO_INTEGRATION_DATABASE_URL: postgresql://nono_integration:nono-integration-only@127.0.0.1:5432/nono_integration_ci
          NONO_INTEGRATION_ALLOW_RESET: 1
        run: npm run test:integration

      - name: Verify repository
        run: npm run verify:all
