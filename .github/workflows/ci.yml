name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/nomoney/package-lock.json
            apps/nostar/package-lock.json

      - name: Install Nono dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Test Nono
        run: npm test

      - name: Test combined gateway contracts
        run: npm run test:gateway

      - name: Audit Nono dependencies
        run: npm audit --audit-level=high

      - name: Build Nono
        run: npm run build:nono

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser smoke flows
        run: npm run test:e2e

      - name: Install Blog dependencies
        working-directory: apps/blog
        run: pnpm install --frozen-lockfile

      - name: Test Blog
        working-directory: apps/blog
        run: pnpm test

      - name: Check Blog types
        working-directory: apps/blog
        run: pnpm typecheck

      - name: Build Blog
        working-directory: apps/blog
        run: pnpm build

      - name: Install NoMoney dependencies
        working-directory: apps/nomoney
        run: npm ci

      - name: Test NoMoney
        working-directory: apps/nomoney
        run: npm test

      - name: Audit NoMoney dependencies
        working-directory: apps/nomoney
        run: npm audit --audit-level=high

      - name: Build NoMoney
        working-directory: apps/nomoney
        run: npm run build

      - name: Install NoStar dependencies
        working-directory: apps/nostar
        run: npm ci

      - name: Test NoStar
        working-directory: apps/nostar
        run: npm run test:run

      - name: Lint NoStar
        working-directory: apps/nostar
        run: npm run lint

      - name: Check NoStar types
        working-directory: apps/nostar
        run: npm run typecheck

      - name: Audit NoStar dependencies
        working-directory: apps/nostar
        run: npm audit --audit-level=high

      - name: Build NoStar
        working-directory: apps/nostar
        run: npm run build

      - name: Check NoStar bundle budget
        working-directory: apps/nostar
        run: npm run bundle:check
