<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoNo Chrome Web Store assets</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI Variable", "MiSans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        background: #e7ecee;
        color: #1f2a2e;
        margin: 0;
        min-height: 100vh;
      }

      .browser-scene {
        background: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.86);
        box-shadow: 0 28px 72px rgba(45, 63, 67, 0.15);
        height: 720px;
        left: 50%;
        overflow: hidden;
        position: absolute;
        top: 40px;
        transform: translateX(-50%);
        width: 1160px;
      }

      .browser-bar {
        align-items: center;
        background: #f7f9f9;
        border-bottom: 1px solid #e2e7e8;
        display: flex;
        gap: 12px;
        height: 56px;
        padding: 0 20px;
      }

      .window-dots { display: flex; gap: 7px; }
      .window-dots span { background: #cbd4d6; border-radius: 50%; height: 10px; width: 10px; }
      .address-bar { background: #ffffff; border: 1px solid #dde4e5; border-radius: 7px; color: #758287; font-size: 13px; padding: 9px 14px; width: 420px; }

      .page {
        background: #e9edef;
        height: calc(100% - 56px);
        overflow: hidden;
        padding: 52px;
        position: relative;
      }

      .page-kicker { color: #167d86; font-size: 14px; font-weight: 750; margin: 0 0 14px; }
      .page h1 { font-size: 36px; line-height: 1.16; margin: 0; max-width: 410px; }
      .page-copy { color: #657278; font-size: 15px; line-height: 1.7; margin: 18px 0 0; max-width: 390px; }
      .folder-grid { display: grid; gap: 14px; grid-template-columns: repeat(3, 100px); margin-top: 48px; }
      .folder { background: rgba(255, 255, 255, 0.64); border: 1px solid rgba(255, 255, 255, 0.86); border-radius: 8px; box-shadow: inset 0 1px 0 #fff; height: 78px; padding: 12px; }
      .folder-mark { background: rgba(22, 125, 134, 0.16); border-radius: 5px; height: 18px; width: 28px; }
      .folder-line { background: #cbd4d6; border-radius: 4px; height: 7px; margin-top: 13px; width: 62px; }

      .popup-frame {
        backdrop-filter: blur(24px) saturate(135%);
        background: rgba(255, 255, 255, 0.64);
        border: 1px solid rgba(255, 255, 255, 0.88);
        border-radius: 8px;
        box-shadow: 0 22px 52px rgba(45, 63, 67, 0.22), inset 0 1px 0 #fff;
        padding: 18px;
        position: absolute;
        right: 76px;
        top: 66px;
        width: 420px;
      }

      .popup-header, .heading, .actions { align-items: center; display: flex; justify-content: space-between; }
      .brand { align-items: center; display: flex; gap: 10px; }
      .brand img { height: 34px; width: 34px; }
      .brand strong { color: #203438; font-size: 20px; }
      .gear { background: rgba(255, 255, 255, 0.72); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 7px; color: #4f6166; font-size: 18px; height: 34px; text-align: center; width: 34px; }
      .preview, .panel { background: rgba(255, 255, 255, 0.68); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 8px; box-shadow: 0 8px 24px rgba(45, 63, 67, 0.08), inset 0 1px 0 #fff; }
      .preview { align-items: center; display: flex; gap: 10px; margin-top: 15px; padding: 13px; }
      .initial { align-items: center; background: rgba(22, 125, 134, 0.14); border: 1px solid rgba(22, 125, 134, 0.14); border-radius: 7px; color: #0f6870; display: flex; font-size: 16px; font-weight: 850; height: 34px; justify-content: center; width: 34px; }
      .domain { color: #657278; font-size: 11px; font-weight: 700; margin: 0 0 4px; }
      .page-title { font-size: 13px; font-weight: 780; margin: 0; }
      .panel { margin-top: 10px; padding: 12px; }
      .heading { min-height: 24px; }
      .eyebrow { color: #657278; font-size: 10px; font-weight: 750; text-transform: uppercase; }
      .ai { color: #0f6870; font-size: 12px; font-weight: 700; }
      .input, .select { background: rgba(250, 252, 252, 0.92); border: 1px solid rgba(107, 127, 132, 0.2); border-radius: 7px; color: #1f2a2e; font-size: 13px; height: 36px; margin-top: 7px; padding: 9px 10px; }
      .field-row { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
      .field-label { color: #59676b; font-size: 11px; font-weight: 750; }
      .select::after { color: #728085; content: "⌄"; float: right; }
      .duplicate { align-items: center; background: rgba(255, 247, 228, 0.9); border: 1px solid rgba(207, 144, 56, 0.3); border-radius: 8px; color: #865318; display: flex; font-size: 11px; justify-content: space-between; margin-top: 10px; padding: 9px 10px; }
      .duplicate span:last-child { background: rgba(255, 255, 255, 0.78); border: 1px solid rgba(177, 111, 28, 0.25); border-radius: 7px; padding: 6px 9px; }
      .status { color: #657278; font-size: 11px; margin: 11px 1px; }
      .actions { gap: 9px; }
      .save { background: #167d86; border-radius: 7px; color: #ffffff; flex: 1; font-size: 13px; font-weight: 760; padding: 11px; text-align: center; }
      .edit { background: rgba(255, 255, 255, 0.72); border: 1px solid rgba(92, 112, 117, 0.18); border-radius: 7px; color: #4a5b60; font-size: 13px; font-weight: 700; padding: 10px 15px; }
      .repo { color: #657278; display: flex; font-size: 10px; justify-content: space-between; margin-top: 10px; }

      .promo {
        align-items: center;
        display: none;
        height: 100vh;
        justify-content: space-between;
        overflow: hidden;
        padding: 0 70px;
      }

      .promo-copy { position: relative; z-index: 2; }
      .promo h1 { color: #203438; font-size: 48px; line-height: 1.1; margin: 0; }
      .promo p { color: #657278; font-size: 20px; line-height: 1.5; margin: 16px 0 0; }
      .promo-mark { align-items: center; background: rgba(255, 255, 255, 0.72); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 8px; box-shadow: 0 22px 52px rgba(45, 63, 67, 0.16), inset 0 1px 0 #fff; display: flex; gap: 20px; padding: 24px 34px; transform: rotate(-4deg); }
      .promo-mark img { height: 96px; width: 96px; }
      .promo-mark strong { color: #203438; font-size: 36px; }

      @media (max-width: 700px) {
        .browser-scene { display: none; }
        .promo { display: flex; padding: 30px; }
        .promo h1 { font-size: 29px; }
        .promo p { font-size: 14px; }
        .promo-mark { gap: 9px; padding: 14px; }
        .promo-mark img { height: 54px; width: 54px; }
        .promo-mark strong { font-size: 21px; }
      }

      @media (min-width: 701px) and (max-height: 650px) {
        .browser-scene { display: none; }
        .promo { display: flex; }
      }
    </style>
  </head>
  <body>
    <section class="browser-scene">
      <header class="browser-bar"><div class="window-dots"><span></span><span></span><span></span></div><div class="address-bar">https://noaul.com</div></header>
      <main class="page">
        <p class="page-kicker">你的个人导航</p>
        <h1>把每个值得留存的网页，放回自己的秩序。</h1>
        <p class="page-copy">NoNo 让收藏、归类和再次找到它们，成为一件轻松的事。</p>
        <div class="folder-grid"><div class="folder"><div class="folder-mark"></div><div class="folder-line"></div></div><div class="folder"><div class="folder-mark"></div><div class="folder-line"></div></div><div class="folder"><div class="folder-mark"></div><div class="folder-line"></div></div></div>
        <aside class="popup-frame">
          <header class="popup-header"><div class="brand"><img src="../icons/nono-48.png" alt="" /><strong>NoNo</strong></div><div class="gear">⚙</div></header>
          <section class="preview"><span class="initial">N</span><div><p class="domain">noaul.com</p><p class="page-title">NoNo 个人导航</p></div></section>
          <section class="panel"><div class="heading"><span class="eyebrow">书签名称</span><span class="ai">AI 整理</span></div><div class="input">NoNo 个人导航</div></section>
          <section class="panel"><div class="heading"><span class="eyebrow">保存到</span></div><div class="field-row"><div><div class="field-label">NoTab</div><div class="select">常用</div></div><div><div class="field-label">文件夹</div><div class="select">灵感</div></div></div></section>
          <div class="duplicate"><span>已收藏为「NoNo」</span><span>更新已有</span></div>
          <p class="status">选好位置后，一次点击即可收藏。</p><div class="actions"><div class="save">另存一份</div><div class="edit">编辑</div></div>
          <div class="repo"><span>GitHub · noaul/nono</span><span>v0.3.0</span></div>
        </aside>
      </main>
    </section>
    <section class="promo"><div class="promo-copy"><h1>快速收藏，<br />回到自己的 NoNo。</h1><p>一键保存网页，清晰归类，随时找到。</p></div><div class="promo-mark"><img src="../icons/nono-128.png" alt="" /><strong>NoNo</strong></div></section>
  </body>
</html>
