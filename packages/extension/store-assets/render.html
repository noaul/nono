<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NONO Chrome Web Store assets</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        background: #f4f7ff;
        color: #17223c;
        margin: 0;
        min-height: 100vh;
      }

      .browser-scene {
        background: #ffffff;
        border: 1px solid #dce4f7;
        box-shadow: 0 28px 72px rgba(45, 65, 120, 0.13);
        height: 720px;
        left: 50%;
        overflow: hidden;
        position: absolute;
        top: 40px;
        transform: translateX(-50%);
        width: 1160px;
      }

      .browser-bar {
        align-items: center;
        background: #f8faff;
        border-bottom: 1px solid #e6ebf8;
        display: flex;
        gap: 12px;
        height: 56px;
        padding: 0 20px;
      }

      .window-dots { display: flex; gap: 7px; }
      .window-dots span { background: #d2daf0; border-radius: 50%; height: 10px; width: 10px; }
      .address-bar { background: #ffffff; border: 1px solid #e0e6f5; border-radius: 7px; color: #7b88a5; font-size: 13px; padding: 9px 14px; width: 420px; }

      .page {
        background: linear-gradient(145deg, #f8fbff 0%, #edf1ff 100%);
        height: calc(100% - 56px);
        overflow: hidden;
        padding: 52px;
        position: relative;
      }

      .page-kicker { color: #5d6ee9; font-size: 14px; font-weight: 750; margin: 0 0 14px; }
      .page h1 { font-size: 36px; line-height: 1.16; margin: 0; max-width: 410px; }
      .page-copy { color: #687795; font-size: 15px; line-height: 1.7; margin: 18px 0 0; max-width: 390px; }
      .folder-grid { display: grid; gap: 14px; grid-template-columns: repeat(3, 100px); margin-top: 48px; }
      .folder { background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(210, 220, 246, 0.94); border-radius: 8px; height: 78px; padding: 12px; }
      .folder-mark { background: #dfe6ff; border-radius: 5px; height: 18px; width: 28px; }
      .folder-line { background: #d8dfef; border-radius: 4px; height: 7px; margin-top: 13px; width: 62px; }

      .popup-frame {
        background: #f4f7ff;
        border: 1px solid #d4ddf4;
        border-radius: 8px;
        box-shadow: 0 22px 52px rgba(45, 59, 116, 0.24);
        padding: 18px;
        position: absolute;
        right: 76px;
        top: 66px;
        width: 400px;
      }

      .popup-header, .heading, .actions { align-items: center; display: flex; justify-content: space-between; }
      .brand { align-items: center; display: flex; gap: 10px; }
      .brand img { height: 34px; width: 34px; }
      .brand strong { color: #26355e; font-size: 20px; }
      .gear { background: #ffffff; border: 1px solid #dfe5f6; border-radius: 7px; color: #596782; font-size: 18px; height: 34px; text-align: center; width: 34px; }
      .preview, .panel { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(214, 222, 244, 0.94); border-radius: 8px; }
      .preview { align-items: center; display: flex; gap: 10px; margin-top: 15px; padding: 13px; }
      .initial { align-items: center; background: #e4eaff; border: 1px solid #d6dffe; border-radius: 7px; color: #5362d8; display: flex; font-size: 16px; font-weight: 850; height: 34px; justify-content: center; width: 34px; }
      .domain { color: #71809e; font-size: 11px; font-weight: 700; margin: 0 0 4px; }
      .page-title { font-size: 13px; font-weight: 780; margin: 0; }
      .panel { margin-top: 10px; padding: 12px; }
      .heading { min-height: 24px; }
      .eyebrow { color: #71809e; font-size: 10px; font-weight: 750; text-transform: uppercase; }
      .ai { color: #5664d7; font-size: 12px; font-weight: 700; }
      .input, .select { background: #ffffff; border: 1px solid #d8e0f3; border-radius: 7px; color: #26355e; font-size: 13px; height: 36px; margin-top: 7px; padding: 9px 10px; }
      .field-row { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
      .field-label { color: #5e6a84; font-size: 11px; font-weight: 750; }
      .select::after { color: #7c88a2; content: "⌄"; float: right; }
      .status { color: #65728b; font-size: 11px; margin: 11px 1px; }
      .actions { gap: 9px; }
      .save { background: #5c67e8; border-radius: 7px; color: #ffffff; flex: 1; font-size: 13px; font-weight: 760; padding: 11px; text-align: center; }
      .edit { background: #ffffff; border: 1px solid #d8e0f3; border-radius: 7px; color: #52607b; font-size: 13px; font-weight: 700; padding: 10px 15px; }

      .promo {
        align-items: center;
        display: none;
        height: 100vh;
        justify-content: space-between;
        overflow: hidden;
        padding: 0 70px;
      }

      .promo-copy { position: relative; z-index: 2; }
      .promo h1 { color: #1b294c; font-size: 48px; line-height: 1.1; margin: 0; }
      .promo p { color: #61708e; font-size: 20px; line-height: 1.5; margin: 16px 0 0; }
      .promo-mark { align-items: center; background: #ffffff; border: 1px solid #d9e1f5; border-radius: 8px; box-shadow: 0 22px 52px rgba(45, 59, 116, 0.16); display: flex; gap: 20px; padding: 24px 34px; transform: rotate(-4deg); }
      .promo-mark img { height: 96px; width: 96px; }
      .promo-mark strong { color: #26355e; font-size: 36px; }

      @media (max-width: 700px) {
        .browser-scene { display: none; }
        .promo { display: flex; padding: 30px; }
        .promo h1 { font-size: 29px; }
        .promo p { font-size: 14px; }
        .promo-mark { gap: 9px; padding: 14px; }
        .promo-mark img { height: 54px; width: 54px; }
        .promo-mark strong { font-size: 21px; }
      }

      @media (min-width: 701px) and (max-height: 650px) {
        .browser-scene { display: none; }
        .promo { display: flex; }
      }
    </style>
  </head>
  <body>
    <section class="browser-scene">
      <header class="browser-bar"><div class="window-dots"><span></span><span></span><span></span></div><div class="address-bar">https://noaul.com</div></header>
      <main class="page">
        <p class="page-kicker">你的个人导航</p>
        <h1>把每个值得留存的网页，放回自己的秩序。</h1>
        <p class="page-copy">NONO 让收藏、归类和再次找到它们，成为一件轻松的事。</p>
        <div class="folder-grid"><div class="folder"><div class="folder-mark"></div><div class="folder-line"></div></div><div class="folder"><div class="folder-mark"></div><div class="folder-line"></div></div><div class="folder"><div class="folder-mark"></div><div class="folder-line"></div></div></div>
        <aside class="popup-frame">
          <header class="popup-header"><div class="brand"><img src="../icons/nono-48.png" alt="" /><strong>NONO</strong></div><div class="gear">⚙</div></header>
          <section class="preview"><span class="initial">N</span><div><p class="domain">noaul.com</p><p class="page-title">NONO 个人导航</p></div></section>
          <section class="panel"><div class="heading"><span class="eyebrow">书签名称</span><span class="ai">AI 整理</span></div><div class="input">NONO 个人导航</div></section>
          <section class="panel"><div class="heading"><span class="eyebrow">保存到</span></div><div class="field-row"><div><div class="field-label">notab</div><div class="select">常用</div></div><div><div class="field-label">文件夹</div><div class="select">灵感</div></div></div></section>
          <p class="status">准备保存。</p><div class="actions"><div class="save">收藏此页</div><div class="edit">编辑</div></div>
        </aside>
      </main>
    </section>
    <section class="promo"><div class="promo-copy"><h1>快速收藏，<br />回到自己的 NONO。</h1><p>一键保存网页，清晰归类，随时找到。</p></div><div class="promo-mark"><img src="../icons/nono-128.png" alt="" /><strong>NONO</strong></div></section>
  </body>
</html>
