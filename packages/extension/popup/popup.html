<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nono 快速收藏</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div class="brand" aria-label="Nono">
          <span class="brand-mark">n</span>
          <strong>nono</strong>
        </div>
        <button id="settingsButton" class="icon-button" type="button" title="连接设置" aria-label="连接设置">&#9881;</button>
      </header>

      <section id="settings" class="settings panel hidden">
        <div class="section-heading">
          <div>
            <span class="eyebrow">连接</span>
            <h1>连接 Nono</h1>
          </div>
          <button id="closeSettings" class="icon-button" type="button" title="关闭设置" aria-label="关闭设置">&#215;</button>
        </div>
        <label>服务地址<input id="serverUrl" placeholder="https://noaul.com" inputmode="url" /></label>
        <label>API Token<input id="token" type="password" placeholder="nono_..." autocomplete="off" /></label>
        <div class="button-row">
          <button id="testConnection" class="secondary-button" type="button">测试连接</button>
          <button id="saveSettings" type="button">保存并开始</button>
        </div>
        <p id="tokenStatus" class="meta-text">填入后台创建的 API Token。</p>
      </section>

      <section id="workflow" class="workflow hidden">
        <section class="page-preview" aria-live="polite">
          <span id="siteInitial" class="site-initial">N</span>
          <div>
            <p id="pageDomain" class="page-domain">读取当前网页...</p>
            <h1 id="pageTitle">准备收藏</h1>
          </div>
        </section>

        <section class="destination panel">
          <div class="section-heading compact">
            <div>
              <span class="eyebrow">保存到</span>
              <h2>选择位置</h2>
            </div>
            <button id="refreshFolders" class="icon-button subtle" type="button" title="刷新文件夹" aria-label="刷新文件夹">&#8635;</button>
          </div>
          <div class="field-grid">
            <label>大类<select id="categorySelect"></select></label>
            <label>文件夹<select id="folderSelect"></select></label>
          </div>
          <p id="destinationHint" class="meta-text">正在读取文件夹...</p>
        </section>

        <p id="duplicateWarning" class="warning hidden"></p>
        <p id="status" class="status" aria-live="polite">准备保存。</p>

        <div class="save-actions">
          <button id="saveBookmark" class="primary-save" type="button">收藏此页</button>
          <button id="toggleDetails" class="secondary-button" type="button" aria-expanded="false">编辑</button>
        </div>

        <section id="details" class="details panel hidden">
          <div class="section-heading compact">
            <div>
              <span class="eyebrow">可选</span>
              <h2>补充信息</h2>
            </div>
            <button id="analyzeBookmark" class="text-button" type="button">AI 整理</button>
          </div>
          <label>标题<input id="name" maxlength="180" /></label>
          <label>描述<textarea id="description" maxlength="1000"></textarea></label>
        </section>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
