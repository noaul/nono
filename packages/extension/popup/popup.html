<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="popupTitle">NoNo 快速收藏</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div class="brand" aria-label="NoNo">
          <img class="brand-mark" src="../icons/nono-48.png" alt="" />
          <div class="brand-copy">
            <strong>NoNo</strong>
            <span data-i18n="quickBookmark">快速收藏</span>
          </div>
        </div>
        <button id="settingsButton" class="icon-button" type="button" data-i18n-title="connectionSettings" data-i18n-aria="connectionSettings" title="连接设置" aria-label="连接设置">
          <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg>
        </button>
      </header>

      <section id="settings" class="settings panel hidden">
        <div class="section-heading">
          <div>
            <span class="eyebrow" data-i18n="connect">连接</span>
            <h1 data-i18n="connectTitle">连接 NoNo</h1>
          </div>
          <button id="closeSettings" class="icon-button quiet" type="button" data-i18n-title="closeSettings" data-i18n-aria="closeSettings" title="关闭设置" aria-label="关闭设置">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
          </button>
        </div>

        <label>
          <span data-i18n="serverUrl">服务地址</span>
          <input id="serverUrl" placeholder="https://nono.example.com" inputmode="url" spellcheck="false" />
        </label>
        <label>
          <span>API Token</span>
          <input id="token" type="password" placeholder="nono_..." autocomplete="off" spellcheck="false" />
        </label>

        <div class="button-row">
          <button id="testConnection" class="secondary-button" type="button" data-i18n="testConnection">测试连接</button>
          <button id="saveSettings" type="button" data-i18n="saveAndStart">保存并开始</button>
        </div>

        <label class="language-row">
          <span data-i18n="language">界面语言</span>
          <select id="languageSelect">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>

        <div class="connection-note">
          <span class="status-dot" aria-hidden="true"></span>
          <p id="tokenStatus" data-i18n="tokenHint">填入后台创建的 API Token。</p>
        </div>
        <p class="privacy-note" data-i18n="privacyHint">仅在你主动收藏时读取当前网页，并只发送到你配置的 NoNo 服务。</p>
      </section>

      <section id="workflow" class="workflow hidden">
        <section id="pagePreview" class="page-preview panel" aria-live="polite">
          <span id="siteInitial" class="site-initial">N</span>
          <div class="page-copy">
            <p id="pageDomain" class="page-domain" data-i18n="readingPage">读取当前网页...</p>
            <h1 id="pageTitle" data-i18n="readyToSave">准备收藏</h1>
          </div>
        </section>

        <div id="bookmarkPanel" class="mode-panel">
          <section class="bookmark-form panel">
            <div class="name-editor">
              <span class="field-label" data-i18n="bookmarkName">书签名称</span>
              <div class="name-row">
                <input id="name" maxlength="180" data-i18n-aria="bookmarkName" aria-label="书签名称" />
                <button id="analyzeBookmark" class="secondary-button" type="button" data-i18n="aiTidy">AI 整理</button>
              </div>
            </div>

            <div class="destination field-grid">
              <label>NoTab<select id="categorySelect"></select></label>
              <label><span data-i18n="folder">文件夹</span><select id="folderSelect"></select></label>
              <button id="refreshFolders" class="icon-button" type="button" data-i18n-title="refreshFolders" data-i18n-aria="refreshFolders" title="刷新文件夹" aria-label="刷新文件夹">
                <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /></svg>
              </button>
            </div>
          </section>

          <section id="duplicateWarning" class="duplicate-callout hidden" aria-live="polite">
            <div>
              <strong data-i18n="duplicateFound">发现重复收藏</strong>
              <p id="duplicateMessage"></p>
            </div>
            <button id="duplicateAction" class="warning-button" type="button" data-i18n="updateExisting">更新已有</button>
          </section>

          <div class="status-line hidden">
            <span class="status-dot" aria-hidden="true"></span>
            <p id="status" class="status" aria-live="polite"></p>
          </div>

          <div class="save-actions">
            <button id="saveBookmark" class="primary-save" type="button" data-i18n="saveThisPage">收藏此页</button>
            <button id="toggleDetails" class="secondary-button edit-button" type="button" aria-expanded="false" data-i18n="edit">编辑</button>
          </div>

          <section id="details" class="details panel hidden">
            <div class="section-heading compact">
              <div>
                <span class="eyebrow" data-i18n="optional">可选</span>
                <h2 data-i18n="extraInfo">补充信息</h2>
              </div>
            </div>
            <label><span class="visually-hidden" data-i18n="description">描述</span><textarea id="description" maxlength="1000"></textarea></label>
          </section>
        </div>
      </section>

      <footer class="project-footer">
        <div>
          <span data-i18n="openSourceOn">开源于</span>
          <a href="https://github.com/noaul/nono" target="_blank" rel="noreferrer">GitHub · noaul/nono</a>
        </div>
        <a class="issue-link" href="https://github.com/noaul/nono/issues" target="_blank" rel="noreferrer" data-i18n="feedback">反馈</a>
        <span id="versionLabel" class="version-label">v0.4.1</span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
