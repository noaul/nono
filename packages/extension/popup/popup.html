<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="popupTitle">NoNo 快速收藏</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div class="brand" aria-label="NoNo">
          <img class="brand-mark" src="../icons/nono-48.png" alt="" />
          <div class="brand-copy">
            <strong>NoNo</strong>
            <span data-i18n="quickBookmark">快速收藏</span>
          </div>
        </div>
        <button id="settingsButton" class="icon-button" type="button" data-i18n-title="connectionSettings" data-i18n-aria="connectionSettings" title="连接设置" aria-label="连接设置">&#9881;</button>
      </header>

      <section id="settings" class="settings glass-panel hidden">
        <div class="section-heading">
          <div>
            <span class="eyebrow" data-i18n="connect">连接</span>
            <h1 data-i18n="connectTitle">连接 NoNo</h1>
          </div>
          <button id="closeSettings" class="icon-button quiet" type="button" data-i18n-title="closeSettings" data-i18n-aria="closeSettings" title="关闭设置" aria-label="关闭设置">&#215;</button>
        </div>

        <label>
          <span data-i18n="serverUrl">服务地址</span>
          <input id="serverUrl" placeholder="https://nono.example.com" inputmode="url" spellcheck="false" />
        </label>
        <label>
          <span>API Token</span>
          <input id="token" type="password" placeholder="nono_..." autocomplete="off" spellcheck="false" />
        </label>

        <div class="button-row">
          <button id="testConnection" class="secondary-button" type="button" data-i18n="testConnection">测试连接</button>
          <button id="saveSettings" type="button" data-i18n="saveAndStart">保存并开始</button>
        </div>

        <label class="language-row">
          <span data-i18n="language">界面语言</span>
          <select id="languageSelect">
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </label>

        <div class="connection-note">
          <span class="status-dot" aria-hidden="true"></span>
          <p id="tokenStatus" data-i18n="tokenHint">填入后台创建的 API Token。</p>
        </div>
        <p class="privacy-note" data-i18n="privacyHint">仅在你主动收藏时读取当前网页，并只发送到你配置的 NoNo 服务。</p>
      </section>

      <section id="workflow" class="workflow hidden">
        <section id="pagePreview" class="page-preview glass-panel" aria-live="polite">
          <span id="siteInitial" class="site-initial">N</span>
          <div class="page-copy">
            <p id="pageDomain" class="page-domain" data-i18n="readingPage">读取当前网页...</p>
            <h1 id="pageTitle" data-i18n="readyToSave">准备收藏</h1>
          </div>
        </section>

        <div class="mode-switch" role="tablist" data-i18n-aria="modeClip" aria-label="模式">
          <button id="modeBookmark" class="mode-option is-active" type="button" role="tab" aria-selected="true" data-i18n="modeBookmark">收藏</button>
          <button id="modeClip" class="mode-option" type="button" role="tab" aria-selected="false" data-i18n="modeClip">剪藏</button>
        </div>

        <section id="clipPanel" class="clip-panel mode-panel hidden">
          <section class="clip-editor glass-panel" aria-live="polite">
            <div class="section-heading compact">
              <div class="clip-source-block">
                <span id="clipStatusLine" class="eyebrow" data-i18n="readingArticle">正在读取正文...</span>
                <a id="clipSourceUrl" class="clip-source-url" target="_blank" rel="noreferrer"></a>
              </div>
              <button id="analyzeClip" class="text-button" type="button" data-i18n="aiAnalyzeClip">AI 分析</button>
            </div>
            <p id="clipPreviewMeta" class="clip-preview-meta" data-i18n="clipPreviewPending">正在生成正文预览...</p>
            <label>
              <span data-i18n="clipTitleLabel">标题</span>
              <input id="clipTitleInput" maxlength="500" data-i18n-aria="clipTitleLabel" aria-label="标题" />
            </label>
            <label>
              <span data-i18n="clipKeywordsLabel">关键词（标签）</span>
              <input id="clipKeywordsInput" maxlength="500" data-i18n-placeholder="clipKeywordsPlaceholder" placeholder="例如：AI, 阅读, 工具" />
            </label>
            <label>
              <span data-i18n="clipSummaryLabel">摘要</span>
              <textarea id="clipSummaryInput" maxlength="2000" rows="2"></textarea>
            </label>
            <p id="clipTruncated" class="clip-truncated hidden" data-i18n="clipTruncated">正文已按体积上限截断。</p>
          </section>
          <div class="save-actions">
            <button id="saveClip" class="primary-save" type="button" data-i18n="clipThisPage">剪藏此页</button>
            <button id="saveClipSelection" class="secondary-button" type="button" data-i18n="clipSelection">剪藏选区</button>
          </div>
        </section>

        <div id="bookmarkPanel" class="mode-panel">
          <section class="name-editor glass-panel">
            <div class="section-heading compact">
              <span class="eyebrow" data-i18n="bookmarkName">书签名称</span>
              <button id="analyzeBookmark" class="text-button" type="button" data-i18n="aiTidy">AI 整理</button>
            </div>
            <input id="name" maxlength="180" data-i18n-aria="bookmarkName" aria-label="书签名称" />
          </section>

          <section class="destination glass-panel">
            <div class="section-heading compact destination-heading">
              <button id="refreshFolders" class="icon-button quiet" type="button" data-i18n-title="refreshFolders" data-i18n-aria="refreshFolders" title="刷新文件夹" aria-label="刷新文件夹">&#8635;</button>
            </div>
            <div class="field-grid">
              <label>NoTab<select id="categorySelect"></select></label>
              <label><span data-i18n="folder">文件夹</span><select id="folderSelect"></select></label>
            </div>
          </section>

          <section id="duplicateWarning" class="duplicate-callout hidden" aria-live="polite">
            <div>
              <strong data-i18n="duplicateFound">发现重复收藏</strong>
              <p id="duplicateMessage"></p>
            </div>
            <button id="duplicateAction" class="warning-button" type="button" data-i18n="updateExisting">更新已有</button>
          </section>

          <div class="status-line hidden">
            <span class="status-dot" aria-hidden="true"></span>
            <p id="status" class="status" aria-live="polite"></p>
          </div>

          <div class="save-actions">
            <button id="saveBookmark" class="primary-save" type="button" data-i18n="saveThisPage">收藏此页</button>
            <button id="toggleDetails" class="secondary-button edit-button" type="button" aria-expanded="false" data-i18n="edit">编辑</button>
          </div>

          <section id="details" class="details glass-panel hidden">
            <div class="section-heading compact">
              <div>
                <span class="eyebrow" data-i18n="optional">可选</span>
                <h2 data-i18n="extraInfo">补充信息</h2>
              </div>
            </div>
            <label><span data-i18n="description">描述</span><textarea id="description" maxlength="1000"></textarea></label>
          </section>
        </div>
      </section>

      <footer class="project-footer">
        <div>
          <span data-i18n="openSourceOn">开源于</span>
          <a href="https://github.com/noaul/nono" target="_blank" rel="noreferrer">GitHub · noaul/nono</a>
        </div>
        <a class="issue-link" href="https://github.com/noaul/nono/issues" target="_blank" rel="noreferrer" data-i18n="feedback">反馈</a>
        <span id="versionLabel" class="version-label">v0.4.1</span>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
