services:
  postgres:
    image: postgres:16-alpine
    container_name: nono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nono
      POSTGRES_USER: nono
      POSTGRES_PASSWORD: nono
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nono_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nono -d nono"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        VITE_BLOG_URL: ${BLOG_NAVIGATION_URL:-/nodesk}
        NEXT_PUBLIC_SITE_URL: ${BLOG_PUBLIC_URL:-http://localhost:3000/nodesk}
        NEXT_PUBLIC_NONO_URL: ${NONO_NAVIGATION_URL:-/}
        NEXT_PUBLIC_BASE_PATH: /nodesk
    container_name: nono
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://nono:nono@postgres:5432/nono?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      NODESK_CONTENT_DIR: /app/nodesk-content
      NODESK_SEED_DIR: /app/nodesk-seed
    volumes:
      - nodesk_content:/app/nodesk-content
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  nono_pg_data:
  nodesk_content:
