services:
  postgres:
    image: postgres:16-alpine
    container_name: nono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nono}
      POSTGRES_USER: ${POSTGRES_USER:-nono}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nono_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${NONO_APP_IMAGE:-nono-app:latest}
    build:
      context: .
      args:
        VITE_BLOG_URL: ${BLOG_NAVIGATION_URL:-/nodesk}
        NEXT_PUBLIC_SITE_URL: ${BLOG_PUBLIC_URL:-http://localhost:3000/nodesk}
        NEXT_PUBLIC_NONO_URL: ${NONO_NAVIGATION_URL:-/}
        NEXT_PUBLIC_BASE_PATH: /nodesk
    container_name: nono
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-127.0.0.1:3000}:3000"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nono}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-nono}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      NONO_PUBLIC_URL: ${NONO_PUBLIC_URL:?NONO_PUBLIC_URL is required}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Nono}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      GATEWAY_TRUST_FORWARDED_HEADERS: ${GATEWAY_TRUST_FORWARDED_HEADERS:-false}
      PRIVATE_OUTBOUND_HOSTS: ${PRIVATE_OUTBOUND_HOSTS:-}
      LINK_HEALTH_CHECK_ENABLED: ${LINK_HEALTH_CHECK_ENABLED:-true}
      LINK_HEALTH_CHECK_INTERVAL_HOURS: ${LINK_HEALTH_CHECK_INTERVAL_HOURS:-24}
      LINK_HEALTH_CHECK_START_DELAY_SECONDS: ${LINK_HEALTH_CHECK_START_DELAY_SECONDS:-60}
      BACKUP_AUTOMATION_POLL_SECONDS: ${BACKUP_AUTOMATION_POLL_SECONDS:-60}
      BACKUP_AUTOMATION_START_DELAY_SECONDS: ${BACKUP_AUTOMATION_START_DELAY_SECONDS:-60}
      NONO_BUILD_COMMIT: ${NONO_BUILD_COMMIT:-unknown}
      BACKUP_DIR: /app/backups
      NODESK_CONTENT_DIR: /app/nodesk-content
      NODESK_SEED_DIR: /app/nodesk-seed
      NOMONEY_INTERNAL_PORT: 2030
      YUMI_INTERNAL_PORT: 2040
      NOMONEY_DATA_DIR: /app/nomoney-data
      NOMONEY_JWT_SECRET: ${NOMONEY_JWT_SECRET:?NOMONEY_JWT_SECRET is required}
      NOMONEY_INTERNAL_TOKEN: ${NOMONEY_INTERNAL_TOKEN:?NOMONEY_INTERNAL_TOKEN is required}
      NOMONEY_ENCRYPTION_KEY: ${NOMONEY_ENCRYPTION_KEY:-}
      NOMONEY_COOKIE_SECURE: ${NOMONEY_COOKIE_SECURE:-true}
      NOMONEY_SMTP_HOST: ${NOMONEY_SMTP_HOST:-}
      NOMONEY_SMTP_PORT: ${NOMONEY_SMTP_PORT:-587}
      NOMONEY_SMTP_USER: ${NOMONEY_SMTP_USER:-}
      NOMONEY_SMTP_PASS: ${NOMONEY_SMTP_PASS:-}
      NOMONEY_SMTP_FROM: ${NOMONEY_SMTP_FROM:-}
      NOMONEY_SMTP_TO: ${NOMONEY_SMTP_TO:-}
      YUMI_DATA_DIR: /app/yumi-data
      YUMI_JWT_SECRET: ${YUMI_JWT_SECRET:?YUMI_JWT_SECRET is required}
      YUMI_ENCRYPTION_KEY: ${YUMI_ENCRYPTION_KEY:?YUMI_ENCRYPTION_KEY is required}
      YUMI_COOKIE_SECURE: ${YUMI_COOKIE_SECURE:-true}
    volumes:
      - nodesk_content:/app/nodesk-content
      - nomoney_data:/app/nomoney-data
      - yumi_data:/app/yumi-data
      - nono_backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  nono_pg_data:
  nodesk_content:
  nomoney_data:
  yumi_data:
  nono_backups:
