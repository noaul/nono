services:
  postgres:
    image: postgres:16-alpine
    container_name: nono-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nono
      POSTGRES_USER: nono
      POSTGRES_PASSWORD: nono
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nono_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nono -d nono"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      additional_contexts:
        blog: "${BLOG_BUILD_CONTEXT:-https://github.com/noaul/2025-blog-public.git#my-features}"
      args:
        VITE_BLOG_URL: ${BLOG_PUBLIC_URL:-http://localhost:3000/blog}
        NEXT_PUBLIC_SITE_URL: ${BLOG_PUBLIC_URL:-http://localhost:3000/blog}
        NEXT_PUBLIC_NONO_URL: ${NONO_PUBLIC_URL:-http://localhost:3000}
        NEXT_PUBLIC_GITHUB_OWNER: ${NEXT_PUBLIC_GITHUB_OWNER:-noaul}
        NEXT_PUBLIC_GITHUB_REPO: ${NEXT_PUBLIC_GITHUB_REPO:-2025-blog-public}
        NEXT_PUBLIC_GITHUB_BRANCH: ${NEXT_PUBLIC_GITHUB_BRANCH:-my-features}
        NEXT_PUBLIC_GITHUB_APP_ID: ${NEXT_PUBLIC_GITHUB_APP_ID:-}
        NEXT_PUBLIC_BASE_PATH: /blog
    container_name: nono
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://nono:nono@postgres:5432/nono?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  nono_pg_data:
